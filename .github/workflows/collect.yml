name: Collect live basketball evidence
on:
  push:
    branches: [main]
    paths-ignore: ['data/**']
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
concurrency:
  group: live-data
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python collect.py
      - name: Preserve immutable forecast evidence
        run: |
          git config user.name 'DOC Live Totals Collector'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          git diff --cached --quiet || git commit -m "Archive forward live totals evidence"
          git push
